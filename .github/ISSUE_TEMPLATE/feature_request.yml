name: Feature Request
description: Something you'd like to see in GameNative IIC
title: "[Request]: "
labels: enhancement
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        **This is the feature-request tracker for the GameNative IIC fork** (`app.gamenative.iic`).
        For requests aimed at the official GameNative app, open an issue at
        [utkarshdalal/GameNative](https://github.com/utkarshdalal/GameNative/issues).

        IIC-specific areas where requests are most welcome:
        - New cheat-table entries for additional games
        - Crash-fix catalog entries (`crashfixes/registry.json`)
        - Auto-Tuner goals or sweep improvements
        - Controller / device-profile additions

  - type: textarea
    id: describe-the-request
    attributes:
      label: Feature Request
      placeholder: It would be cool if...
    validations:
      required: true

  - type: checkboxes
    id: request-already-searched
    attributes:
      label: New Feature
      description: Is the request not already posted as an [Issue](https://github.com/mayusi/IsItCompatible-GameNative/issues?q=is%3Aissue%20state%3Aopen%20label%3Aenhancement)?
      options:
        - label: I have searched and did not find my request already listed.
          required: true
