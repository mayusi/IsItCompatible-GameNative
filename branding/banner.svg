<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="NovaGN banner">
  <title>NovaGN</title>
  <desc>Premium minimal banner: NovaGN emblem and wordmark on a near-black canvas with a single indigo accent and a refined feature row.</desc>
  <defs>
    <radialGradient id="accent-glow" cx="82%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6D5BF6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6D5BF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="emblem-round"><rect x="0" y="0" width="512" height="512" rx="116" ry="116"/></clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="420" fill="#0B0B0F"/>
  <!-- One soft accent glow, upper-right, for depth -->
  <rect width="1280" height="420" fill="url(#accent-glow)"/>
  <!-- Hairline frame -->
  <rect x="0.5" y="0.5" width="1279" height="419" fill="none" stroke="#1C1C26" stroke-width="1"/>

  <!-- Emblem, left -->
  <g transform="translate(96, 110) scale(0.39)">
    <g clip-path="url(#emblem-round)">
      <rect x="0" y="0" width="512" height="512" fill="#0F0F16"/>
      <rect x="0" y="0" width="512" height="270" fill="#17171F"/>
      <rect x="150" y="146" width="48" height="220" fill="#FAFAFA"/>
      <rect x="314" y="146" width="48" height="220" fill="#FAFAFA"/>
      <path d="M198 146 L246 146 L362 312 L362 366 L314 366 L198 200 Z" fill="#6D5BF6"/>
      <path d="M362 146 L362 198 L336 172 Z" fill="#6D5BF6"/>
    </g>
    <rect x="1" y="1" width="510" height="510" rx="115" ry="115" fill="none" stroke="#2A2A36" stroke-width="2"/>
  </g>

  <!-- Wordmark -->
  <text x="330" y="186"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="92" font-weight="700" letter-spacing="-2.5">
    <tspan fill="#FAFAFA">Nova</tspan><tspan fill="#6D5BF6">GN</tspan>
  </text>

  <!-- Value prop -->
  <text x="334" y="232"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="27" font-weight="400" fill="#B6B9C4">Run PC games on Android — tuned, cheated, and sped up.</text>

  <!-- Feature row: clean dot-separated labels, no boxes -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
    <circle cx="338" cy="296" r="4" fill="#6D5BF6"/>
    <text x="352" y="303" fill="#E4E5EA">Universal speed hack</text>

    <circle cx="606" cy="296" r="4" fill="#6D5BF6"/>
    <text x="620" y="303" fill="#E4E5EA">Smart auto-tuner</text>

    <circle cx="838" cy="296" r="4" fill="#6D5BF6"/>
    <text x="852" y="303" fill="#E4E5EA">Built-in cheat engine</text>
  </g>

  <!-- Credit, bottom -->
  <text x="334" y="356"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="18" font-weight="400" fill="#5F6068">Built on GameNative.</text>
</svg>
