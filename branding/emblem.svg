<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NovaGN emblem">
  <title>NovaGN emblem</title>
  <desc>Minimal monogram: a sharp geometric N on a near-black rounded square with a single electric-indigo accent diagonal.</desc>
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="116" ry="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Near-black base -->
    <rect x="0" y="0" width="512" height="512" fill="#0B0B0F"/>
    <!-- Very subtle top panel for depth (premium, low-contrast — not a loud gradient) -->
    <rect x="0" y="0" width="512" height="270" fill="#13131B"/>

    <!-- The N: two white vertical stems + an electric-indigo diagonal -->
    <!-- left stem -->
    <rect x="150" y="146" width="48" height="220" fill="#FAFAFA"/>
    <!-- right stem -->
    <rect x="314" y="146" width="48" height="220" fill="#FAFAFA"/>
    <!-- accent diagonal connecting top-left stem to bottom-right stem -->
    <path d="M198 146 L246 146 L362 312 L362 366 L314 366 L198 200 Z" fill="#6D5BF6"/>
    <!-- small accent spark, top-right -->
    <path d="M362 146 L362 198 L336 172 Z" fill="#6D5BF6"/>
  </g>

  <!-- Hairline inner border for crispness -->
  <rect x="0.75" y="0.75" width="510.5" height="510.5" rx="115.5" ry="115.5"
        fill="none" stroke="#2A2A36" stroke-width="1.5"/>
</svg>
