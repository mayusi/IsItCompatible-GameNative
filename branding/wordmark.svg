<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="NovaGN wordmark">
  <title>NovaGN wordmark</title>
  <desc>NovaGN horizontal lockup: minimal N emblem, Nova in white, GN in electric indigo, with a powered-by-GameNative credit.</desc>

  <!-- Transparent-friendly dark base for standalone use -->
  <rect width="1200" height="320" fill="#0B0B0F"/>

  <!-- Emblem (the N monogram), scaled ~210x210, left -->
  <g transform="translate(40, 55) scale(0.4)">
    <clipPath id="round-wm"><rect x="0" y="0" width="512" height="512" rx="116" ry="116"/></clipPath>
    <g clip-path="url(#round-wm)">
      <rect x="0" y="0" width="512" height="512" fill="#0F0F16"/>
      <rect x="0" y="0" width="512" height="270" fill="#17171F"/>
      <rect x="150" y="146" width="48" height="220" fill="#FAFAFA"/>
      <rect x="314" y="146" width="48" height="220" fill="#FAFAFA"/>
      <path d="M198 146 L246 146 L362 312 L362 366 L314 366 L198 200 Z" fill="#6D5BF6"/>
      <path d="M362 146 L362 198 L336 172 Z" fill="#6D5BF6"/>
    </g>
    <rect x="1" y="1" width="510" height="510" rx="115" ry="115" fill="none" stroke="#2A2A36" stroke-width="2"/>
  </g>

  <!-- Wordmark: "Nova" white + "GN" accent -->
  <text x="280" y="178"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="118" font-weight="700" letter-spacing="-3">
    <tspan fill="#FAFAFA">Nova</tspan><tspan fill="#6D5BF6">GN</tspan>
  </text>

  <!-- Tagline -->
  <text x="284" y="226"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="26" font-weight="400" fill="#9CA0AD" letter-spacing="0.5">Run PC games on Android.</text>

  <!-- Credit line -->
  <text x="284" y="262"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="400" fill="#5F6068" letter-spacing="0.5">Built on GameNative.</text>
</svg>
