<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Teal→violet gradient for "IIC" text and emblem -->
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Emblem shine -->
    <linearGradient id="grad-shine" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- IIC text gradient (horizontal) -->
    <linearGradient id="grad-text-iic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Emblem shadow -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.4"/>
    </filter>
    <!-- Glyph glow -->
    <filter id="glyph-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: transparent so it works on any surface -->
  <!-- Dark ink bg for standalone use -->
  <rect width="1200" height="320" fill="#0b1120"/>

  <!-- ═══════════════════════════════════════════════
       LEFT: Emblem (scaled ~220×220, centered at x=130)
       ═══════════════════════════════════════════════ -->
  <g transform="translate(30, 50) scale(0.43)">
    <!-- Badge -->
    <rect x="28" y="28" width="456" height="456" rx="96" ry="96"
          fill="url(#grad-main)" filter="url(#shadow)"/>
    <rect x="28" y="28" width="456" height="456" rx="96" ry="96"
          fill="url(#grad-shine)"/>
    <rect x="76" y="76" width="360" height="360" rx="72" ry="72"
          fill="#0b1120" opacity="0.35"/>

    <!-- Controller body -->
    <g filter="url(#glyph-glow)">
      <rect x="118" y="196" width="276" height="148" rx="40" ry="40" fill="#f8fafc"/>
      <rect x="118" y="304" width="96" height="80" rx="28" ry="28" fill="#f8fafc"/>
      <rect x="298" y="304" width="96" height="80" rx="28" ry="28" fill="#f8fafc"/>
      <!-- D-pad -->
      <rect x="160" y="236" width="52" height="18" rx="5" ry="5" fill="#0b1120"/>
      <rect x="177" y="219" width="18" height="52" rx="5" ry="5" fill="#0b1120"/>
      <!-- Buttons -->
      <circle cx="332" cy="236" r="8" fill="#0b1120"/>
      <circle cx="356" cy="252" r="8" fill="#0b1120"/>
      <circle cx="308" cy="252" r="8" fill="#0b1120"/>
      <circle cx="332" cy="268" r="8" fill="#0b1120"/>
      <!-- Home -->
      <circle cx="256" cy="252" r="18" fill="#0b1120"/>
      <!-- Checkmark -->
      <polyline points="210,260 238,292 302,216"
        fill="none" stroke="url(#grad-main)"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Ring -->
    <rect x="28" y="28" width="456" height="456" rx="96" ry="96"
          fill="none" stroke="url(#grad-main)" stroke-width="3" opacity="0.6"/>
  </g>

  <!-- ═══════════════════════════════════════════════
       RIGHT: Text lockup
       ═══════════════════════════════════════════════ -->

  <!-- "GameNative" — weight 800, light foreground -->
  <text
    x="260" y="155"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="96"
    font-weight="800"
    fill="#f8fafc"
    dominant-baseline="auto"
    letter-spacing="-2">GameNative</text>

  <!-- "IIC" — weight 600, gradient fill -->
  <text
    x="264" y="220"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="54"
    font-weight="600"
    fill="url(#grad-text-iic)"
    dominant-baseline="auto"
    letter-spacing="8">IIC</text>

  <!-- Vertical separator between "IIC" and tagline -->
  <line x1="344" y1="196" x2="344" y2="234" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>

  <!-- Tagline -->
  <text
    x="356" y="220"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="22"
    font-weight="400"
    fill="#94a3b8"
    dominant-baseline="auto">Is It Compatible? fork — run PC games on Android</text>

  <!-- Thin gradient underline beneath "GameNative IIC" -->
  <defs>
    <linearGradient id="underline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect x="260" y="235" width="680" height="3" rx="2" fill="url(#underline-grad)"/>
</svg>
